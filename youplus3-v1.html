<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You+3 by GOLF+</title>
<!--
  YOU+3 by GOLF+ (working title) : build-your-dream-foursome
  Single file, no backend, deterministic. Parody brands intentional (closed-link demo).

  ROB'S EDITING GUIDE
  1. To add a celebrity: copy any block in CELEBS, change the name, five scores
     (exactly one 5 or one 1 per celeb, that is their signature), wing, decade
     (PREWAR/MIDCENTURY/RETRO/Y2K/MODERN), pol/lm flags, card hook, and two "ev"
     event lines for the recap. That is the whole job.
  2. To tune tone: everything the recap can say lives in RECAP_LIB and each celeb's "ev".
  3. To tune matching feel: CONFIG knobs below, all commented.
  4. To rename the game: CONFIG.title.
-->
<style>
:root{
  --green:#123B23; --green2:#1F4E2C; --cream:#F6F1E5; --card:#FFFFFF;
  --gold:#C9A227; --ink:#1C2620; --sub:#5B6B60; --line:#E3DCC9; --red:#B33A2B;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{background:var(--green); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; justify-content:center;}
#app{width:100%; max-width:480px; min-height:100vh; background:var(--cream); margin:0 auto;
  display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.35);}
.screen{padding:22px 18px 36px; animation:fade .35s ease; flex:1; display:flex; flex-direction:column;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.brand{font-weight:800; letter-spacing:.14em; font-size:12px; color:var(--green2); text-transform:uppercase;}
h1{font-size:44px; line-height:1.02; color:var(--green); font-weight:900; letter-spacing:-.02em; margin:10px 0 6px;}
h2{font-size:24px; color:var(--green); font-weight:850; margin-bottom:6px; letter-spacing:-.01em;}
.sub{color:var(--sub); font-size:15px; line-height:1.45;}
.btn{display:block; width:100%; border:none; border-radius:14px; padding:16px;
  font-size:17px; font-weight:750; cursor:pointer; margin-top:14px;
  background:var(--green); color:var(--cream); transition:transform .06s ease;}
.btn:active{transform:scale(.985);}
.btn.gold{background:var(--gold); color:var(--green);}
.btn.ghost{background:transparent; color:var(--green2); border:2px solid var(--green2);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.meter{position:sticky; top:0; z-index:5; background:var(--cream); padding:10px 0 8px; border-bottom:2px solid var(--line);}
.meter .row{display:flex; justify-content:space-between; align-items:baseline;}
.meter b{font-size:26px; color:var(--green);}
.meter .tag{font-size:12px; color:var(--sub); font-weight:600;}
.cat{margin-top:18px;}
.cat h3{font-size:15px; color:var(--green2); text-transform:uppercase; letter-spacing:.08em;}
.cat .why{font-size:12.5px; color:var(--sub); margin:2px 0 8px;}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.opt{border:2px solid var(--line); background:var(--card); border-radius:12px;
  padding:10px 10px 9px; cursor:pointer; text-align:left; font-size:14px; font-weight:650; color:var(--ink);
  display:flex; justify-content:space-between; align-items:center; gap:6px; transition:border-color .12s;}
.opt .price{font-size:12px; font-weight:800; color:var(--green2); background:var(--cream);
  border-radius:8px; padding:3px 7px; white-space:nowrap;}
.opt.sel{border-color:var(--green); background:#EAF2EB;}
.opt.legend{border-color:var(--gold);}
.opt.legend .price{background:var(--gold); color:var(--green);}
.opt:disabled{opacity:.35; cursor:not-allowed;}
.legendtag{font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--gold); text-transform:uppercase; display:block;}
.q-progress{display:flex; gap:6px; margin-bottom:18px;}
.q-progress i{flex:1; height:4px; border-radius:2px; background:var(--line);}
.q-progress i.on{background:var(--green);}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:18px 0 10px;}
.scale button{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:16px 0;
  font-size:18px; font-weight:800; color:var(--green2); cursor:pointer;}
.scale button:active{border-color:var(--green); background:#EAF2EB;}
.anchors{display:flex; justify-content:space-between; gap:14px;}
.anchors span{font-size:12.5px; color:var(--sub); line-height:1.35; max-width:46%;}
.anchors span:last-child{text-align:right;}
.mc .opt{margin-bottom:8px; width:100%; padding:14px 12px;}
.mc{display:block;}
.reveal{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center;}
.spinner{width:54px; height:54px; border-radius:50%; border:5px solid var(--line); border-top-color:var(--green); animation:spin 1s linear infinite; margin-bottom:18px;}
@keyframes spin{to{transform:rotate(360deg);}}
.fcard{background:var(--card); border-radius:16px; padding:14px 14px 12px; margin-top:10px;
  border:2px solid var(--line); box-shadow:0 3px 14px rgba(18,59,35,.07); animation:fade .4s ease both;}
.fcard .wing{font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--cream);
  background:var(--green2); border-radius:7px; padding:3px 8px; display:inline-block;}
.fcard .wing.Presidents{background:var(--red);} .fcard .wing.Legends{background:var(--gold); color:var(--green);}
.fcard .wing.Athletes{background:#2B5D8C;} .fcard .wing.Entertainers{background:#6C4A8C;}
.fcard h3{font-size:21px; color:var(--green); margin:7px 0 3px; letter-spacing:-.01em;}
.fcard p{font-size:13.5px; color:var(--sub); line-height:1.4;}
.fcard.you{border-color:var(--green); background:#EAF2EB;}
.fcard.lebron{border-color:var(--gold); background:#FFF9E8; position:relative;}
.fcard.lebron::before{content:"UNINVITED"; position:absolute; top:-9px; right:12px; background:var(--gold);
  color:var(--green); font-size:10px; font-weight:900; letter-spacing:.1em; padding:2px 8px; border-radius:6px;}
.recap{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px; margin-top:16px;}
.recap h4{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--green2); margin-bottom:8px;}
.recap p{font-size:15px; line-height:1.6;}
.rating{font-size:34px; font-weight:900; color:var(--green); margin-top:10px;}
.coach{font-size:12.5px; color:var(--sub); margin-top:12px; text-align:center;}
.foot{font-size:11px; color:var(--sub); text-align:center; margin-top:22px; opacity:.8;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green);
  color:var(--cream); padding:10px 18px; border-radius:12px; font-size:14px; font-weight:650; opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>

<script>
// [ENGINE-START]
"use strict";

/* ============================== CONFIG (tuning knobs) ============================== */
const CONFIG = {

const AXES = ["EAG","STY","ENT","ATH","COM"];

/* LeBron special card: not a roster row, crashes on trigger */
const LEBRON = {n:"LeBron James", w:"SPECIAL", dec:"MODERN",
  hook:"Crashed your foursome uninvited.",
  card:"LeBron James crashed your foursome uninvited. He was fine today. He will be better than everyone here within 18 months and nobody wants to admit it, least of all you."};

/* ============================== RECAP LIBRARY ============================== */
const RECAP_LIB = {
  openings:[
    "Well, the good news first: everyone showed up on time, which nobody predicted, and the first tee had more color than a yacht regatta.",
    "Well, this one was an unforgettable round, and not entirely for golf reasons.",
    "The starter took one look at your group and radioed ahead. Smart man.",
    "Good news and bad news, in that order, as is tradition.",
    "Well, nobody got arrested, which for this particular group qualifies as a headline.",
    "The valet saw your foursome assembling and called in backup. He was right to.",
    "History will remember this round. The scorecard, mercifully, will not.",
    "Your group got paired with perfect weather and used approximately none of it.",
    "The first tee announcement ran long because two of the names required context.",
    "By 8am the clubhouse had a rooting interest in your group. By noon it had a betting pool.",
  ],
  incidents:[
    "A brief rainstorm blew through around the turn and everyone pretended not to notice.",
    "The marshal spoke to your group twice, both times about pace, both times fairly.",
    "Someone used a beer can as a tee on 16. The marshal chose peace.",
    "A goose confronted your group on 7 and won.",
    "The pin position on 12 should have required a permit.",
    "Your group found four balls in the woods on 15. Three were yours, from previous lives.",
    "The beverage cart made an unscheduled second lap for your group specifically.",
    "A dog appeared on 11, adopted your group for three holes, and left with better course management than most of you.",
    "Somebody's rangefinder said 156 and lied.",
    "The par 3 on 8 collected two tee shots and offered nothing in return.",
    "Play paused on 9 while everyone watched a member three fairways over have a much worse day.",
    "The turn ran out of ice at the exact moment your group arrived. Investigations are ongoing.",
    "A sprinkler head went off on 13 and got exactly one of you. The group agreed it chose correctly.",
    "The group behind waved you through, then immediately regretted losing the entertainment.",
  ],
  signoffsHigh:["Great round.","Nice work.","Same time next Saturday."],
  signoffsLow:["Nice work.","You will laugh about this by Tuesday.","Tell nobody what you saw on 14."],
  turn:{
    water:"You ordered water at the turn and the table went quiet, like you had said something political.",
    banana:"The banana and trail mix told the group everything: you came here to post a number.",
    hotdogAfar:"Word of your hotdog order reached Colonel Sanders, who called it 'honest work, wrong bird.'",
    hotdogIn:"The Colonel watched you order a hotdog, said nothing, and tipped his hat with the weary respect of a man who has lost soldiers to that exact stand.",
    beer:"You bought all the beer they had at the turn, which explains both the birdie on 12 and everything after 14.",
  },
  thrift:"You also left {x} points unspent, which the group respected exactly zero percent.",
  legendBuild:"You spent nearly everything on the lesson, and it showed: Costgo fit, carrying your own bag, swinging like a dream.",
};

/* If both names land in the foursome, this beat can fire (max one per recap). */
const PAIR_BEATS = [
  ["Mike Trout","Tony Romo","Mike Trout spent the whole round explaining how the Eagles would crush Romo's Cowboys. Tony Romo responded with a 40-yard bomb and a smile."],
  ["William Taft","Babe Ruth","Taft and Babe Ruth turned the turn window into a hotdog eating contest. The staff still talks about it. Nobody won. Everybody won."],
  ["Dolly Parton","Colonel Sanders","Dolly and the Colonel held a fried chicken summit at the turn. A truce was reached. Recipes were not exchanged."],
  ["Willie Nelson","Snoop Dogg","Willie and Snoop's cart disappeared for two holes and came back noticeably happier."],
  ["Michael Jordan","Charles Barkley","MJ and Barkley's side bets escalated until the caddies formed a small regulatory body."],
  ["Tom Brady","Rory McIlroy","Brady and Rory formed a two-man support group about The Match. No new members were accepted."],
  ["Jordan Spieth","Ben Crenshaw","Spieth and Crenshaw held a Texas green-reading summit on 13 that ran longer than some legislative sessions."],
  ["Winston Churchill","Al Capone","Churchill and Capone negotiated something in the parking lot. Nobody asked. The round improved immediately."],
  ["Amelia Earhart","Evel Knievel","Earhart and Knievel argued the entire back nine about who takes the more direct line to the pin."],
  ["Sean Connery","Michael Buble","Connery and Buble argued martini versus Manhattan until the turn window ran out of both."],
  ["John F. Kennedy","Bill Clinton","JFK and Clinton compared mulligan math until both scorecards achieved diplomatic immunity."],
  ["Bob Hope","Bill Murray","Bob Hope and Bill Murray traded one-liners for six holes. The group forgot to keep score. Correct decision."],
];

const INSTRUCTOR_BEATS = {
  "Box Store Bob":"Box Store Bob's pre-round lesson happened in the parking lot and doubled as a timeshare pitch.",
  "Albert Zapata":"Albert Zapata said almost nothing, fixed your grip once, and changed your life.",
  "Tim Cup":"Tim Cup filmed your swing from four angles and emailed a recap before you reached the first tee.",
  "Local Golf Pro":"Your local pro walked the front nine with you and said 'trust it' at exactly the right moment.",
  "Butch Harmon":"Butch Harmon rebuilt your takeaway on the range, and you hit the three best drives of your life on the back nine.",
  "John Daly":"John Daly's lesson was one sentence, 'grip it and rip it,' delivered mid-bite.",
};
const DALY_TAFT_DUEL = "John Daly and William Taft ate all the hotdogs at the turn, then challenged each other to a duel. Cooler heads prevailed, barely, and the duel was downgraded to a putting contest.";

/* ============================== ENGINE ============================== */
/* Session memory: never reuse an opening or incident until the whole pool has been heard.
   Kills repeats during pass-the-phone demos. Resets on page reload. */
const USED={op:new Set(), inc:new Set()};
function pickFresh(arr, used, rng){
  let pool=arr.filter(x=>!used.has(x));
  if(!pool.length){used.clear(); pool=arr.slice();}
  const x=pool[Math.floor(rng()*pool.length)];
  used.add(x); return x;
}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function priceToAxis(p){return p>=7?5:1+(p-1)*4/3;}

/* picks: {EAG:{name,price}, STY:{...}, ...}   answers: {decade, politics, playwatch, turn, EAG..COM, chirp} */
function validateBudget(picks){
  const cats=Object.keys(picks||{});
  if(cats.length!==5) return {ok:false, msg:"Pick one option in every category."};
  const spend=cats.reduce((s,k)=>s+picks[k].price,0);
  if(spend>CONFIG.budget) return {ok:false, msg:"Over budget."};
  return {ok:true, spend, left:CONFIG.budget-spend};
}

function runMatch(picks, answers){
  const key=JSON.stringify([Object.keys(picks).sort().map(k=>picks[k].name), answers]);
  const seed=hashStr(key);
  const rng=mulberry32(seed);
  const pick=arr=>arr[Math.floor(rng()*arr.length)];

  // player vector: blend spend (trusted more) with claims
  const player={}, weights={};
  AXES.forEach((ax,i)=>{
    const b=priceToAxis(picks[ax].price);
    const q=answers[ax];
    player[ax]=CONFIG.wBudget*b+CONFIG.wQuiz*q;
    weights[ax]=1;
  });
  if(answers.playwatch==="play") weights.ATH=CONFIG.athWeightPlay;

  // gate first, then score
  let pool=CELEBS.filter(c=>!(answers.politics==="never"&&c.pol));
  const scored=pool.map(c=>{
    let d=0;
    AXES.forEach((ax,i)=>{d+=weights[ax]*Math.abs(player[ax]-c.v[i]);});
    if(c.dec===answers.decade) d-=CONFIG.decadeBonus;
    d+=(hashStr(c.n+key)%1000)/1000*CONFIG.jitter;
    return {c,d};
  }).sort((a,b)=>a.d-b.d);

  // curation: max one loudmouth (zero if chirp answer is 1-2), max two per wing
  const maxLoud=answers.chirp<=2?0:1;
  const four=[], wingCt={}; let loud=0;
  for(const {c} of scored){
    if(four.length===3) break;
    if(c.lm&&loud>=maxLoud) continue;
    if((wingCt[c.w]||0)>=2) continue;
    four.push(c); wingCt[c.w]=(wingCt[c.w]||0)+1; if(c.lm) loud++;
  }
  for(const {c} of scored){ // safety fill, loudmouth cap stays hard
    if(four.length===3) break;
    if(four.includes(c)) continue;
    if(c.lm&&loud>=maxLoud) continue;
    four.push(c); if(c.lm) loud++;
  }

  const lebron=picks.EAG.price>=4&&answers.playwatch==="watch";

  return {four, lebron, seed, rng, pick, key,
          instructor:picks.EAG.name,
          spend:AXES.reduce((s,ax)=>s+picks[ax].price,0), picks, answers};
}

function buildRecap(m){
  const {four, answers, picks, pick, rng}=m;
  const names=four.map(c=>c.n);
  const parts=[pickFresh(RECAP_LIB.openings, USED.op, rng)];

  // celebrity beats, one per member
  const beats=four.map(c=>pick(c.ev));

  // Daly + Taft duel is canon and overrides Taft's own beat
  const dalyDuel=(picks.EAG.name==="John Daly"&&names.includes("William Taft"));
  if(dalyDuel){beats[names.indexOf("William Taft")]=DALY_TAFT_DUEL;}
  else if(INSTRUCTOR_BEATS[picks.EAG.name]&&rng()<0.85){parts.push(INSTRUCTOR_BEATS[picks.EAG.name]);}

  // one pair beat max
  const pairs=PAIR_BEATS.filter(p=>names.includes(p[0])&&names.includes(p[1]));
  const pairBeat=pairs.length?pick(pairs)[2]:null;

  // turn joke, Colonel-aware
  let turn=RECAP_LIB.turn[answers.turn];
  if(answers.turn==="hotdog") turn=names.includes("Colonel Sanders")?RECAP_LIB.turn.hotdogIn:RECAP_LIB.turn.hotdogAfar;

  parts.push(beats[0]);
  if(pairBeat) parts.push(pairBeat);
  parts.push(turn, beats[1], pickFresh(RECAP_LIB.incidents, USED.inc, rng), beats[2]);

  const v=validateBudget(picks);
  if(v.left>=2) parts.push(RECAP_LIB.thrift.replace("{x}",v.left));
  if(picks.EAG.price>=7&&picks.STY.price<=1&&picks.ATH.price<=2) parts.push(RECAP_LIB.legendBuild);
  if(m.lebron) parts.push("Also, LeBron James showed up. Nobody invited him. See below.");

  // rating: loudmouths and beer runs cost you, deterministically
  let rating=10;
  if(four.some(c=>c.lm)) rating-=1;
  if(answers.turn==="beer") rating-=1;
  if(rng()<0.5) rating-=1;
  rating=Math.max(7,rating);
  const signoff=pick(rating>=9?RECAP_LIB.signoffsHigh:RECAP_LIB.signoffsLow);
  parts.push(`Overall ${rating}/10 round. ${signoff}`);

  return {text:parts.join(" "), rating};
}

function playRound(picks, answers){
  const m=runMatch(picks, answers);
  const recap=buildRecap(m);
  const share=`I built my dream foursome: ${m.four.map(c=>c.n).join(", ")}, and me. ${recap.rating}/10 round. ${CONFIG.title}.`;
  return {four:m.four, lebron:m.lebron, recap:recap.text, rating:recap.rating, share, instructor:m.instructor};
}

const GAME={CONFIG,AXES,CATEGORIES,QUESTIONS,CELEBS,LEBRON,validateBudget,playRound,runMatch,buildRecap,
  _clearUsed:()=>{USED.op.clear();USED.inc.clear();}};
if(typeof module!=="undefined") module.exports=GAME;
// [ENGINE-END]
</script>
<script>
/* ============================== UI ============================== */
const app=document.getElementById("app");
let S={picks:{}, answers:{}, qi:0};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}

function screenIntro(){
  app.innerHTML=`
  <div class="screen">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="brand">A GOLF+ fever dream</div>
      <h1>YOU<span style="color:var(--gold)">+3</span></h1>
      <p class="sub" style="font-size:17px; margin-top:8px;">${GAME.CONFIG.budget} points. Five categories. Three legends and you.</p>
      <p class="sub" style="margin-top:14px;">Spend your budget like it matters, answer ten questions like yourself, and we will assemble the celebrity foursome you actually deserve. Then you get the round recap. You always get the recap.</p>
      <button class="btn gold" onclick="screenBudget()">Build my foursome</button>
    </div>
    <div class="foot">A closed-door demo. All brands lovingly parodied. No golfers were harmed.</div>
  </div>`;
}

function spent(){return Object.values(S.picks).reduce((s,p)=>s+p.price,0);}

function buildLabel(){
  const p=S.picks; if(Object.keys(p).length<5) return "";
  const prices=GAME.AXES.map(ax=>p[ax].price);
  if(prices.some(x=>x>=7)) return "THE LEGEND BUILD";
  if(Math.max(...prices)-Math.min(...prices)<=1) return "THE BALANCED BUILD";
  if(prices.filter(x=>x<=1).length>=2&&Math.max(...prices)>=4) return "THE SPLURGE BUILD";
  return "YOUR BUILD";
}

function screenBudget(){
  const left=GAME.CONFIG.budget-spent();
  app.innerHTML=`
  <div class="screen" style="padding-top:12px;">
    <div class="meter">
      <div class="row"><span class="brand">Your budget</span><span class="tag" id="bl">${buildLabel()}</span></div>
      <div class="row"><b id="pts">${left}</b><span class="tag">points left of ${GAME.CONFIG.budget}. One pick per category.</span></div>
    </div>
    <div id="cats"></div>
    <button class="btn" id="go" ${Object.keys(S.picks).length===5?"":"disabled"} onclick="startQuiz()">To the questionnaire</button>
  </div>`;
  const cats=document.getElementById("cats");
  GAME.CATEGORIES.forEach(cat=>{
    const div=document.createElement("div"); div.className="cat";
    div.innerHTML=`<h3>${cat.name}</h3><div class="why">${cat.why}</div>`;
    const grid=document.createElement("div"); grid.className="opts";
    cat.opts.forEach(([name,price,tier])=>{
      const b=document.createElement("button");
      b.className="opt"+(tier?" legend":"")+(S.picks[cat.ax]&&S.picks[cat.ax].name===name?" sel":"");
      b.innerHTML=`<span>${tier?'<span class="legendtag">Legend tier</span>':""}${name}</span><span class="price">${price} pt${price>1?"s":""}</span>`;
      const cur=S.picks[cat.ax]?S.picks[cat.ax].price:0;
      if(price>GAME.CONFIG.budget-spent()+cur&&!(S.picks[cat.ax]&&S.picks[cat.ax].name===name)) b.disabled=true;
      b.onclick=()=>{const y=window.scrollY; S.picks[cat.ax]={name,price}; screenBudget(); window.scrollTo(0,y);};
      grid.appendChild(b);
    });
    div.appendChild(grid); cats.appendChild(div);
  });
}

function startQuiz(){
  const v=GAME.validateBudget(S.picks);
  if(!v.ok){toast(v.msg); return;}
  S.qi=0; S.answers={}; screenQuiz();
}

function screenQuiz(){
  const q=GAME.QUESTIONS[S.qi];
  const dots=GAME.QUESTIONS.map((_,i)=>`<i class="${i<=S.qi?"on":""}"></i>`).join("");
  let body="";
  if(q.type==="scale"){
    body=`<div class="scale">${[1,2,3,4,5].map(n=>`<button onclick="answer('${q.id}',${n})">${n}</button>`).join("")}</div>
    <div class="anchors"><span>${q.lo}</span><span>${q.hi}</span></div>`;
  }else{
    body=`<div class="mc">${q.opts.map(([label,val])=>`<button class="opt" onclick="answer('${q.id}','${val}')"><span>${label}</span></button>`).join("")}</div>`;
  }
  app.innerHTML=`
  <div class="screen">
    <div class="q-progress">${dots}</div>
    <div class="brand">Question ${S.qi+1} of ${GAME.QUESTIONS.length}</div>
    <h2 style="margin-top:8px;">${q.q}</h2>
    ${body}
  </div>`;
}

function answer(id,val){
  S.answers[id]=val; S.qi++;
  if(S.qi<GAME.QUESTIONS.length) screenQuiz(); else screenReveal();
}

function screenReveal(){
  app.innerHTML=`
  <div class="screen"><div class="reveal">
    <div class="spinner"></div>
    <h2>Assembling your foursome</h2>
    <p class="sub">Checking politics gates. Capping loudmouths. Consulting the Colonel.</p>
  </div></div>`;
  setTimeout(screenResults,1400);
}

function screenResults(){
  const r=GAME.playRound(S.picks,S.answers);
  const cards=r.four.map((c,i)=>`
    <div class="fcard" style="animation-delay:${i*0.18}s">
      <span class="wing ${c.w}">${c.w}</span><h3>${c.n}</h3><p>${c.hook}</p>
    </div>`).join("");
  const lebron=r.lebron?`
    <div class="fcard lebron" style="animation-delay:0.72s">
      <span class="wing" style="background:var(--gold); color:var(--green);">SPECIAL</span>
      <h3>${GAME.LEBRON.n}</h3><p>${GAME.LEBRON.card}</p>
    </div>`:"";
  app.innerHTML=`
  <div class="screen">
    <div class="brand">Your foursome</div>
    <h2>See you on the first tee.</h2>
    ${cards}
    <div class="fcard you" style="animation-delay:0.54s"><span class="wing" style="background:var(--green);">You</span><h3>You</h3><p>The architect of everything that follows.</p></div>
    ${lebron}
    <div class="recap">
      <h4>The round, as it happened</h4>
      <p>${r.recap}</p>
      <div class="rating">${r.rating}/10</div>
    </div>
    <div class="coach">Coached by ${r.instructor}. ${r.lebron?"Crashed by LeBron.":""}</div>
    <button class="btn gold" onclick="share(${JSON.stringify(r.share).replace(/"/g,"&quot;")})">Share this foursome</button>
    <button class="btn ghost" onclick="replay()">Run it back</button>
    <div class="foot">A closed-door demo. All brands lovingly parodied.</div>
  </div>`;
  window.scrollTo(0,0);
}

function share(text){
  if(navigator.share){navigator.share({text}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast("Copied. Go brag."));}
  else toast(text);
}

function replay(){S={picks:{},answers:{},qi:0}; screenBudget(); window.scrollTo(0,0);}

screenIntro();
</script>
